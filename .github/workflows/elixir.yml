# base configuration pulled from:
# https://github.com/dashbitco/broadway/blob/master/.github/workflows/ci.yml

name: CI
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    strategy:
      fail-fast: false
      matrix:
        # Only pairs that actually exist. Elixir/OTP compatibility:
        # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
        #   1.17 -> OTP 25-27   1.19 -> OTP 26-28
        #   1.18 -> OTP 25-27   1.20 -> OTP 27-29
        # Floors are Elixir 1.17 / OTP 27 (see mix.exs); OTP 26 and below are EOL.
        include:
          - elixir: "1.17"
            otp: "27.x"
          - elixir: "1.18"
            otp: "27.x"
          - elixir: "1.19"
            otp: "27.x"
          - elixir: "1.19"
            otp: "28.x"
          - elixir: "1.20"
            otp: "27.x"
          - elixir: "1.20"
            otp: "28.x"
          - elixir: "1.20"
            otp: "29.x"
            lint: lint
            coverage: coverage
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Install Dependencies
        run: mix deps.get --only test

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix deps.get && mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - run: mix test

      - run: mix credo --strict

      - run: mix coveralls.github
        if: ${{matrix.coverage}}
